name: PS5 Pro Stock Monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ps5-pro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python stock_monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then git add state.json; fi
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update monitor state"
            git push
          fi
